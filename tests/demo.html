<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Meet Improve · local test</title>
<style>body{font:16px system-ui;margin:32px;background:#f5f5f5;color:#222;max-width:650px}button{font:inherit;padding:8px;margin:4px}h1{font-size:22px}.nMcdL{padding:12px;border-bottom:1px solid #ccc}.NWpY1d{font-weight:600}.ygicle{margin-top:6px}</style>
<h1>Caption test — no OpenAI requests</h1>
<p>This page uses synthetic captions and mock translations. It does not launch Codex.</p>
<button id="append">Add caption</button><button id="edit">Correct caption</button><button id="replace">Replace container</button>
<button id="checks">Run browser checks</button><pre id="check-result"></pre>
<div role="region" aria-label="Captions"><div class="nMcdL"><span class="NWpY1d">Test participant</span><div class="ygicle">This caption was already visible before starting.</div></div></div>
<script>
window.sent = [];
window.sentAt = [];
window.connected = false;
// Capture the closed shadow root ONLY inside this test fixture for assertions.
const attach = Element.prototype.attachShadow;
Element.prototype.attachShadow = function(options) { const root = attach.call(this, options); if (this.id === 'meet-improve-panel') window.panel = root; return root; };
window.chrome = {runtime: {connect() {
  let receiver, disconnected, alive = true;
  window.connected = true;
  window.deliver = message => alive && receiver(message);
  setTimeout(() => alive && receiver({type:'ready',protocol:4}), 20);
  return {onMessage:{addListener(fn){receiver=fn;}},onDisconnect:{addListener(fn){disconnected=fn;}},
    postMessage(message) {
      window.sent.push(message);
      window.sentAt.push(performance.now());
      if (window.mockManual) return;
      const revision=window.sent.length, delay=window.mockDelay ?? 80;
      const result = {requestId:message.requestId,windowId:message.window.id,
        segments:message.window.segments.map(x=>({id:x.id,text:'v'+revision+': '+x.text}))};
      if (window.mockProgress) setTimeout(() => alive && receiver({type:'progress',...result,
        segments:result.segments.slice(0,Math.max(1,Math.floor(result.segments.length/2)))}), delay/2);
      setTimeout(() => alive && receiver({type:'result',elapsedMs:delay,...result}), delay);
    },
    disconnect(){if(alive){alive=false;window.connected=false;disconnected?.();}}
  };
}}};
function add(text='今日は新しい機能について説明します。') {
 const el=document.createElement('div');el.className='nMcdL';
 const name=document.createElement('span');name.className='NWpY1d';name.textContent='Test participant';
 const body=document.createElement('div');body.className='ygicle';body.textContent=text;el.append(name,body);
 document.querySelector('[role=region]').append(el);
}
document.getElementById('append').onclick=()=>add();
document.getElementById('edit').onclick=()=>{document.querySelector('[role=region]').lastElementChild.querySelector('.ygicle').firstChild.data='今日は修正した機能について説明します。';};
document.getElementById('replace').onclick=()=>{const root=document.querySelector('[role=region]');root.replaceWith(root.cloneNode(true));};
</script>
<script src="../captions.js"></script><script src="../panel.js"></script><script src="../content.js"></script>
<script src="browser-checks.js"></script>
<script>document.getElementById('checks').onclick=async()=>{try{document.getElementById('check-result').textContent=JSON.stringify(await runBrowserChecks(),null,2);}catch(error){document.getElementById('check-result').textContent=error.stack;}};</script>
</html>
