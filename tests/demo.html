<!doctype html>
<html lang="ru"><meta charset="utf-8"><title>Meet Improve · локальный тест</title>
<style>body{font:16px system-ui;margin:32px;background:#f5f5f5;color:#222;max-width:650px}button{font:inherit;padding:8px;margin:4px}h1{font-size:22px}.nMcdL{padding:12px;border-bottom:1px solid #ccc}.NWpY1d{font-weight:600}.ygicle{margin-top:6px}</style>
<h1>Тест субтитров — без отправки в OpenAI</h1>
<p>Это синтетическая страница. Ответы переводчика подставные; настоящий Codex здесь не запускается.</p>
<button id="append">Добавить реплику</button><button id="edit">Исправить реплику</button><button id="replace">Заменить контейнер</button>
<div role="region" aria-label="Captions"><div class="nMcdL"><span class="NWpY1d">Тестовый участник</span><div class="ygicle">Это старая реплика до старта.</div></div></div>
<script>
window.sent = [];
window.connected = false;
// Capture the closed shadow root ONLY inside this test fixture for assertions.
const attach = Element.prototype.attachShadow;
Element.prototype.attachShadow = function(options) { const root = attach.call(this, options); if (this.id === 'meet-improve-panel') window.panel = root; return root; };
window.chrome = {runtime: {connect() {
  let receiver, disconnected, alive = true;
  window.connected = true;
  setTimeout(() => alive && receiver({type:'ready',protocol:3}), 20);
  return {onMessage:{addListener(fn){receiver=fn;}},onDisconnect:{addListener(fn){disconnected=fn;}},
    postMessage(message) { window.sent.push(message); const revision=window.sent.length; setTimeout(() => alive && receiver({type:'result',requestId:message.requestId,elapsedMs:80,windowId:message.window.id,segments:message.window.segments.map(x=>({id:x.id,text:'v'+revision+': '+x.text}))}), window.mockDelay ?? 80); },
    disconnect(){if(alive){alive=false;window.connected=false;disconnected?.();}}
  };
}}};
function add(text='今日は新しい機能について説明します。') {
 const el=document.createElement('div');el.className='nMcdL';
 const name=document.createElement('span');name.className='NWpY1d';name.textContent='Тестовый участник';
 const body=document.createElement('div');body.className='ygicle';body.textContent=text;el.append(name,body);
 document.querySelector('[role=region]').append(el);
}
document.getElementById('append').onclick=()=>add();
document.getElementById('edit').onclick=()=>{document.querySelector('[role=region]').lastElementChild.querySelector('.ygicle').firstChild.data='今日は修正した機能について説明します。';};
document.getElementById('replace').onclick=()=>{const root=document.querySelector('[role=region]');root.replaceWith(root.cloneNode(true));};
</script>
<script src="../captions.js"></script><script src="../content.js"></script>
</html>
